name: Tripoto Travel
description: Tripoto is a travel community and trip-planning platform where travelers discover destinations,
  read and publish first-person travel itineraries and stories, and browse and book curated trips, tours,
  and experiences. Content is largely user-generated, with travel guides organized by destination, theme,
  and season. Tripoto was surfaced as a portfolio company of 500 Global and is tracked in the API Evangelist
  network. At the time of this profile no public developer API, OpenAPI specification, or developer portal
  was discoverable; an api.tripoto.com host exists but serves the consumer application backend.
